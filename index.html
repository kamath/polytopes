<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polytopes</title>
<meta name="description" content="Turn a regular polygon, the solid built from it, and the 4D polytope built from that solid.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
</head>
<body>
<main class="wide">
<h1>Polytopes</h1>
<p class="meta">A flat shape, the solid built from it, and the 4D shape built from that solid. Drag any of them to turn it. <a href="explainer.html">What am I looking at?</a></p>
<figure class="fig" id="viz">
  <div class="tri">
    <div><div class="cv"><canvas role="img" aria-label="The flat shape"></canvas></div><p class="lab" id="viz-l2"></p><div class="seg" id="viz-b2" role="group" aria-label="Flat shape"></div></div>
    <div><div class="cv"><canvas role="img" aria-label="The solid built from the flat shape"></canvas></div><p class="lab" id="viz-l3"></p><div class="seg" id="viz-b3" role="group" aria-label="Solid"></div></div>
    <div class="last"><div class="cv"><canvas role="img" aria-label="The solid shadow of the 4D shape built from the solid"></canvas></div><p class="lab" id="viz-l4"></p><div class="seg" id="viz-b4" role="group" aria-label="4D shape"></div></div>
  </div>
  <div class="ctl">
    <button class="btn" id="viz-play" type="button" aria-pressed="false">Pause</button>
    <span class="k">Dragging the 4D shape</span>
    <div class="seg" id="viz-drag" role="group" aria-label="Dragging the 4D shape">
      <button class="btn" data-d="3" type="button" aria-pressed="true">turns its shadow</button>
      <button class="btn" data-d="4" type="button" aria-pressed="false">turns it in 4D</button>
    </div>
    <button class="btn" id="viz-adv" type="button" aria-pressed="false" aria-controls="viz-advrow">Advanced</button>
  </div>
  <div class="ctl" id="viz-advrow" hidden>
    <label class="chk"><input type="checkbox" id="viz-solid"> Solid faces</label>
    <button class="btn" id="viz-reset" type="button">Reset view</button>
    <span class="k">Scroll or pinch to zoom. Shift-drag or two fingers to move the view.</span>
  </div>
  <p class="out" id="viz-out"></p>
</figure>
</main>
<script type="module" src="/src/home.js"></script>
</body>
</html>
